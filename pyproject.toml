[project]
name = "assef"
version = "0.1.4"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.0", "openai>=1.0", "requests>=2.0", "fastapi>=0.100", "uvicorn>=0.20", "websockets>=12.0"]

[project.scripts]
assef-server = "assef.api.server:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
